<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crochê pru Cê</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button id="botao-noturno" title="Modo noturno">🌙</button>

    <h1>Meu gráfico</h1>

    <div id="tamanho">
        <label>Pontos por carreira (largura)
            <input type="number" id="colunas" min="1" max="200" value="30">
        </label>
        <label>Carreiras (altura)
            <input type="number" id="linhas" min="1" max="200" value="30">
        </label>
        <label>Cores da foto (máx.)
            <input type="number" id="cores-foto" min="2" max="20" value="8">
        </label>
        <button id="criar">Mudar tamanho</button>
    </div>

    <div id="escolha-fio">
        <button id="botao-fio">
            <span id="amostra"></span>
            <span id="fio-atual"></span>
            <span>▾</span>
        </button>
        <div id="paleta" class="escondida"></div>
    </div>

    <div id="area-grade">
        <div id="grade"></div>
    </div>

    <div id="acoes">
        <button id="desfazer" title="Desfazer (Ctrl+Z)" disabled>↶ Desfazer</button>
        <button id="limpar">Limpar grade</button>
        <button id="usar-foto">📷 Usar foto</button>
        <input type="file" id="arquivo-foto" accept="image/*" hidden>
        <button id="salvar-png">Salvar PNG</button>
        <button id="gerar">Gerar Receita</button>
    </div>
    <div id="receita"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="fios.js"></script>
    <script src="script.js"></script>
</body>

</html>
